# CI — PR 단계에서 `npm run verify` 를 강제한다.
#
# 왜 있나. 이 레포의 검사는 원래 `prepublishOnly`(build + verify:dist) 에서만
# 강제됐다. 그 시점은 **npm publish 를 누르는 순간**이라, 깨진 것을 발행 직전에야
# 알게 된다. 관문을 PR 로 당기는 게 이 파일의 전부다.
#
# 여기서 도는 것과 손으로 돌리는 것이 같아야 한다 —
# 그래서 단계를 나열하지 않고 package.json 의 `verify` 하나를 부른다
# (typecheck → lint → test → build → verify:dist). 스크립트가 바뀌면 CI 도 따라온다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 워크플로가 저장소를 읽기만 하면 된다. 쓰기 토큰을 쥐여주지 않는다.
permissions:
  contents: read

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # 한 버전이 깨져도 나머지 결과를 봐야 원인이 좁혀진다.
      fail-fast: false
      matrix:
        # package.json 의 engines 는 ">=22.18.0" — 타입 스트리핑이 플래그 없이
        # 되는 첫 버전이다(Node 문서 이력표: v22.18.0, v23.6.0). 이 레포는 .ts 를
        # 직접 실행하므로 그 아래로는 못 내려간다.
        # ★ 하한은 **정확한 버전으로 핀한다.** `22` 라고 쓰면 최신 22.x 로 풀려서
        #   정작 하한인 22.18.0 은 한 번도 안 돌게 된다.
        # 하한 22.18.0 과 24 LTS 와 최신 26 을 함께 본다. engines 를 고치면 여기도 고칠 것.
        node: ['22.18.0', 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # 이 레포의 락파일은 package-lock 이 아니라 npm-shrinkwrap 이다.
          cache-dependency-path: npm-shrinkwrap.json

      # 락파일 그대로 설치한다. package.json 과 어긋나면 여기서 멈춘다.
      - name: Install
        run: npm ci

      # ★ 거짓 초록 방지.
      #
      # 렌더 테스트는 `findChrome()` 이 실패하면 **조용히 skip** 한다
      # (src/__tests__/render.test.ts 의 `t.skip('크롬이 없어 건너뜀')`).
      # 크롬이 없는 러너에서도 CI 는 초록으로 끝난다 — 안 돈 것과 통과한 것이
      # 구분되지 않는다. 그래서 먼저 크롬을 못 박고 시작한다.
      #
      # ⚠️ `which google-chrome` 으로 확인하면 안 된다. findChrome() 은 PATH 를
      #    보지 않고 CANDIDATES 의 **절대경로 목록**을 훑는다(src/render/chrome.ts).
      #    크롬이 PATH 에는 있는데 그 목록에 없는 자리에 깔리면 which 는 통과하고
      #    렌더 테스트는 여전히 skip 된다 — 가드가 있으나 마나가 된다.
      #    그래서 흉내내지 않고 **그 함수를 그대로 부른다.**
      #
      # ubuntu-latest = Ubuntu 24.04 이고 이 이미지에는 Google Chrome 이
      # /usr/bin/google-chrome 으로 들어 있다(러너 이미지 문서 확인).
      # 이미지가 바뀌어 사라지면 이 단계에서 빨갛게 죽는 편이 낫다.
      - name: Chrome 확인 (렌더 테스트가 조용히 skip 되는 것을 막는다)
        run: |
          node -e "
          import('./src/render/chrome.ts')
            .then(m => m.findChrome())
            .then(p => console.log('크롬 발견:', p))
            .catch(e => { console.error('크롬 없음 —', e.message.split('\n')[0]); process.exit(1); });
          "

      # ★ 같은 이유로 이모지 폰트도 못 박는다.
      #
      # 줄높이는 상수가 아니라 **글자를 재서** 정한다(sequence.ts 의 lineHeightOf).
      # 이 규칙이 필요한 이유가 이모지다 — 같은 font-size 라도 글리프가 15px 보다
      # 높아서, 상수로 쌓으면 같은 라벨의 두 줄이 서로 물린다.
      #
      # ⚠️ 그런데 러너에 이모지 폰트가 없으면 이모지가 보통 글자 높이로 그려진다.
      #    그러면 규칙을 상수로 되돌려도 아무 일이 안 일어나고, 그걸 잡으라고 둔
      #    변이시험이 **아무것도 증명하지 않으면서 초록이 된다.** 실제로 그랬다.
      #    (2026-08-24: 맥에서는 잡히고 CI 에서는 안 잡혔다.)
      - name: 이모지 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji
          fc-cache -f > /dev/null

      # 깔렸는지 흉내내지 말고 확인한다. 크롬 가드와 같은 규율이다 —
      # 없으면 조용히 넘어가는 대신 여기서 빨갛게 죽는 편이 낫다.
      - name: 이모지 폰트 확인 (변이시험이 헛돌지 않게)
        run: |
          if ! fc-list | grep -qi emoji; then
            echo "이모지 폰트가 없다 — S4 의 줄높이 변이가 헛돈다" >&2
            exit 1
          fi
          fc-list | grep -i emoji | head -3

      - name: Verify
        run: npm run verify
