<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>velog-mcp cuttoon</title>
<style>
@font-face{font-family:P;src:url(../Pretendard-Regular.woff2);font-weight:400}
@font-face{font-family:P;src:url(../Pretendard-SemiBold.woff2);font-weight:600}
@font-face{font-family:P;src:url(../Pretendard-Bold.woff2);font-weight:700}
@font-face{font-family:P;src:url(../Pretendard-ExtraBold.woff2);font-weight:800}
@font-face{font-family:M;src:url(../JBMono.woff2);font-weight:500}
:root{--bg:#f3f2ee;--ink:#1f2328;--g:#12b886;--g2:#0ca678;--mint:#e3f6ef;--gray:#8b939c;--line:#e4e2dc;--card:#fff;--sun:#ffe7a0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:P,sans-serif;color:var(--ink)}
.p{position:relative;width:1080px;height:1350px;background:var(--bg);overflow:hidden}
.top{position:absolute;top:56px;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:700;color:var(--gray)}
.tag{display:flex;align-items:center;gap:12px;color:var(--ink)}
.tag i{width:34px;height:34px;border-radius:10px;background:var(--g);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.num{font-family:M,monospace;font-size:24px}
.cap{position:absolute;top:140px;left:72px;right:72px}
.step{display:inline-flex;align-items:center;height:48px;padding:0 20px;border-radius:999px;background:var(--mint);color:var(--g2);font-size:24px;font-weight:800;margin-bottom:22px}
.h{font-size:62px;font-weight:800;letter-spacing:-2px;line-height:1.22}
.h em{font-style:normal;color:var(--g)}
.h u{text-decoration:none;background:linear-gradient(transparent 62%,var(--sun) 62%)}
.stage{position:absolute;left:72px;right:72px;top:420px;height:800px;background:var(--card);border-radius:44px;box-shadow:0 14px 34px rgba(40,36,30,.08),0 2px 6px rgba(40,36,30,.05);overflow:hidden}
.foot{position:absolute;bottom:58px;left:72px;right:72px;display:flex;align-items:center;justify-content:space-between;font-size:26px;color:var(--gray);font-weight:600}
.dots{display:flex;gap:10px}.dots b{width:12px;height:12px;border-radius:50%;background:#d6d3cb}.dots b.on{background:var(--ink);width:34px;border-radius:6px}
svg.ch{position:absolute}
.bub{position:absolute;background:#fff;box-shadow:0 10px 28px rgba(40,36,30,.10),0 1px 3px rgba(40,36,30,.06);border-radius:30px;padding:22px 30px;font-size:36px;font-weight:700;line-height:1.35;letter-spacing:-.5px;white-space:nowrap}
.bub::after{content:"";position:absolute;width:26px;height:26px;background:#fff;border-radius:0 0 6px 0}
.bub.tl::after{left:58px;bottom:-16px;transform:rotate(45deg)}
.bub.tr2::after{right:58px;bottom:-16px;transform:rotate(45deg)}
.bub.g{background:var(--g);color:#fff}.bub.g::after{background:var(--g)}
.sfx{position:absolute;font-weight:800;color:var(--g);font-size:34px}
/* editor */
.ed{position:absolute;left:300px;top:70px;width:560px;height:330px;border-radius:24px;background:#f7f6f2;padding:34px 36px}
.ed .t{font-size:40px;font-weight:800;color:#c4c1b8}
.ed .cur{display:inline-block;width:4px;height:44px;background:var(--g);vertical-align:-8px;margin-left:2px}
.ed .ln{height:16px;border-radius:8px;background:#eeece6;margin-top:22px}
/* drafts */
.dr{position:absolute;width:300px;height:96px;background:#fff;box-shadow:0 14px 34px rgba(40,36,30,.08),0 2px 6px rgba(40,36,30,.05);border-radius:20px;display:flex;align-items:center;gap:16px;padding:0 22px;font-size:26px;font-weight:700}
.dr span{display:inline-flex;height:36px;padding:0 12px;border-radius:999px;background:#f1efe9;color:var(--gray);font-size:20px;align-items:center}
/* phone */
.ph{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:560px;height:760px;border:10px solid #f0efea;border-radius:60px;background:#fff;box-shadow:0 14px 34px rgba(40,36,30,.08),0 2px 6px rgba(40,36,30,.05);padding:40px 30px;display:flex;flex-direction:column;gap:22px}
.ph .hd{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;color:var(--gray);padding:0 8px 18px;border-bottom:2px solid var(--line)}
.ph .hd i{width:30px;height:30px;border-radius:50%;background:var(--g)}
.me{align-self:flex-end;background:var(--g);color:#fff;font-size:30px;font-weight:700;padding:20px 26px;border-radius:28px 28px 8px 28px;line-height:1.35;max-width:420px}
.chip{align-self:flex-start;display:flex;align-items:center;gap:12px;font-family:M,monospace;font-size:24px;color:var(--g2);background:var(--mint);padding:12px 18px;border-radius:14px}
.ok{width:30px;height:30px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center}
.dc{align-self:flex-start;width:440px;border-radius:24px;background:#f7f6f2;padding:24px 26px}
.dc h4{font-size:28px;font-weight:800;line-height:1.3}
.dc .pills{display:flex;gap:8px;margin:14px 0 4px}
.dc .pills span{height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;background:var(--mint);color:var(--g2);font-size:20px;font-weight:700}
.dc .ln{height:12px;border-radius:6px;background:#eeece6;margin-top:12px}
.ai{align-self:flex-start;font-size:28px;line-height:1.45;font-weight:600}
/* lock list */
.ll{position:absolute;left:54px;right:54px;bottom:54px;display:flex;flex-direction:column;gap:16px}
.li{display:flex;align-items:center;gap:22px;background:#f7f6f2;border-radius:24px;padding:22px 28px;font-size:30px;font-weight:700}
.li small{display:block;font-size:22px;color:var(--gray);font-weight:600;margin-top:4px}
.ico{flex:none;width:64px;height:64px;border-radius:18px;background:var(--mint);display:flex;align-items:center;justify-content:center}
/* stats */
.bars{position:absolute;left:54px;right:54px;top:54px;border-radius:28px;padding:30px 32px;background:#f7f6f2}
.bars h5{font-size:26px;font-weight:800;margin-bottom:18px;display:flex;justify-content:space-between}
.bars h5 span{font-family:M,monospace;color:var(--g2);font-size:22px;font-weight:500}
.br{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:22px;font-weight:600}
.br .n{width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#555b63}
.br .tr{flex:1;height:26px;border-radius:8px;background:#eeece6;overflow:hidden}
.br .fl{height:100%;background:var(--g);border-radius:8px}
.br .tr.o .fl{background:#9fe0c9}
.br .v{width:90px;text-align:right;font-family:M,monospace;font-size:21px}
/* cover & cta */
.cover .h{font-size:84px;letter-spacing:-3px}
.swipe{display:inline-flex;align-items:center;gap:12px;height:64px;padding:0 30px;border-radius:999px;background:var(--ink);color:#fff;font-size:28px;font-weight:700}
.cmd{position:absolute;left:54px;right:54px;top:300px;background:var(--ink);border-radius:28px;padding:34px 38px;font-family:M,monospace;font-size:28px;line-height:1.8;color:#e6edf3}
.cmd b{color:#38d9a9;font-weight:500}
.cmd .c{color:#6e7681}
.logo{position:absolute;left:0;right:0;top:80px;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo .mk{display:flex;align-items:center;gap:18px;font-size:76px;font-weight:800;letter-spacing:-3px}
.logo .mk i{width:92px;height:92px;border-radius:26px;background:var(--g);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:58px}
.logo p{font-size:32px;color:var(--gray);font-weight:700}
.save{position:absolute;left:54px;right:54px;bottom:54px;display:flex;align-items:center;gap:20px;padding:26px 30px;border-radius:24px;background:var(--mint);font-size:28px;font-weight:700;color:var(--g2)}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── character: 새싹 찹쌀떡 (soft clay) ─────────────────
// viewBox 300×300, 외곽선 없이 그라데이션·그림자만으로 입체감
const INK="#2b2f36",G="#12b886",G2="#63d6ad";
let _id=0;
function blob(o){
  const k=++_id, sen=o.kind==="senior", melt=!!o.melt;
  const pal=sen?["#f6fdf9","#e2f6ec","#bfe6d3"]:["#ffffff","#fdf6ec","#ecdcc6"];
  const top=melt?134:72, ey=melt?214:176;
  const body=melt
    ? `M150 ${top} C 232 ${top} 280 188 280 230 C 280 258 228 268 150 268 C 72 268 20 258 20 230 C 20 188 68 ${top} 150 ${top} Z`
    : `M150 ${top} C 224 ${top} 260 138 260 202 C 260 248 214 266 150 266 C 86 266 40 248 40 202 C 40 138 76 ${top} 150 ${top} Z`;
  const defs=`<defs>
    <radialGradient id="b${k}" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="${pal[0]}"/><stop offset=".55" stop-color="${pal[1]}"/><stop offset="1" stop-color="${pal[2]}"/></radialGradient>
    <linearGradient id="l${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${G2}"/><stop offset="1" stop-color="${G}"/></linearGradient>
    <linearGradient id="lp${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f7f9"/><stop offset="1" stop-color="#d9dde3"/></linearGradient>
    <filter id="s${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="f${k}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  let g=`<ellipse cx="150" cy="${melt?268:266}" rx="${melt?124:96}" ry="13" fill="#3b3226" opacity=".16" filter="url(#s${k})"/>`;
  g+=`<path d="${body}" fill="url(#b${k})"/>`;
  g+=`<ellipse cx="${melt?110:116}" cy="${top+(melt?26:34)}" rx="${melt?36:26}" ry="${melt?10:14}" fill="#fff" opacity=".9" filter="url(#f${k})" transform="rotate(-18 116 ${top+34})"/>`;
  // 새싹
  const sy=top+3;
  g+=`<path d="M150 ${sy} Q148 ${sy-16} 150 ${sy-28}" stroke="#2f9e74" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(sen){
    g+=`<path d="M150 ${sy-26} C 160 ${sy-62} 200 ${sy-66} 210 ${sy-48} C 196 ${sy-24} 168 ${sy-18} 150 ${sy-26} Z" fill="url(#l${k})"/>
        <path d="M156 ${sy-28} Q180 ${sy-44} 200 ${sy-50}" stroke="#fff" stroke-opacity=".5" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else {
    g+=`<path d="M150 ${sy-24} C 130 ${sy-50} 104 ${sy-44} 98 ${sy-30} C 114 ${sy-14} 136 ${sy-14} 150 ${sy-24} Z" fill="${G2}"/>
        <path d="M150 ${sy-24} C 166 ${sy-58} 198 ${sy-56} 206 ${sy-38} C 190 ${sy-18} 166 ${sy-14} 150 ${sy-24} Z" fill="url(#l${k})"/>
        <path d="M156 ${sy-26} Q178 ${sy-40} 196 ${sy-42}" stroke="#fff" stroke-opacity=".45" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  }
  // 팔
  const arm=(cx,cy,r)=>`<ellipse cx="${cx}" cy="${cy}" rx="15" ry="21" transform="rotate(${r} ${cx} ${cy})" fill="url(#b${k})"/><ellipse cx="${cx}" cy="${cy}" rx="15" ry="21" transform="rotate(${r} ${cx} ${cy})" fill="none" stroke="${pal[2]}" stroke-width="2" opacity=".8"/>`;
  if(!o.laptop && !melt && !o.mug) g+= o.arms==="up" ? arm(38,146,-28)+arm(262,146,28) : arm(48,214,24)+arm(252,214,-24);
  // 얼굴
  const L=120,R=180,e=o.eye||"dot";
  const eye=(x)=>({
    dot:`<ellipse cx="${x}" cy="${ey}" rx="9.5" ry="11.5" fill="${INK}"/><circle cx="${x-3}" cy="${ey-4.5}" r="3.6" fill="#fff"/>`,
    spark:`<ellipse cx="${x}" cy="${ey}" rx="12.5" ry="14.5" fill="${INK}"/><path d="M${x-4} ${ey-10} l2 4.6 4.6 2 -4.6 2 -2 4.6 -2 -4.6 -4.6 -2 4.6 -2z" fill="#fff"/><circle cx="${x+5}" cy="${ey+6}" r="2.4" fill="#fff"/>`,
    happy:`<path d="M${x-10} ${ey+3} Q${x} ${ey-9} ${x+10} ${ey+3}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
    small:`<circle cx="${x}" cy="${ey}" r="6" fill="${INK}"/>`,
    line:`<path d="M${x-10} ${ey+1} Q${x} ${ey+5} ${x+10} ${ey+1}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
    shock:`<ellipse cx="${x}" cy="${ey-2}" rx="11" ry="13" fill="${INK}"/><circle cx="${x-3}" cy="${ey-7}" r="4" fill="#fff"/><circle cx="${x+3.5}" cy="${ey+3}" r="1.8" fill="#fff"/>`,
    calm:`<path d="M${x-10} ${ey} Q${x} ${ey+8} ${x+10} ${ey}" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`,
    up:`<ellipse cx="${x+2}" cy="${ey-5}" rx="9" ry="11" fill="${INK}"/><circle cx="${x-1}" cy="${ey-10}" r="3.4" fill="#fff"/>`,
  })[e];
  const my=ey+19;
  const mouth={
    smile:`<path d="M143 ${my} Q150 ${my+7} 157 ${my}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`,
    open:`<path d="M140 ${my-2} Q150 ${my+18} 160 ${my-2} Q150 ${my+1} 140 ${my-2} Z" fill="${INK}"/><ellipse cx="150" cy="${my+8}" rx="5" ry="3" fill="#ff9a9a"/>`,
    flat:`<path d="M144 ${my+2} L156 ${my+2}" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`,
    wave:`<path d="M139 ${my+2} q3.7 -4.5 7.3 0 t7.3 0 t7.3 0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`,
    o:`<ellipse cx="150" cy="${my+4}" rx="6.5" ry="8" fill="${INK}"/>`,
    cat:`<path d="M140 ${my} Q145 ${my+6} 150 ${my} Q155 ${my+6} 160 ${my}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`,
  }[o.mouth||"smile"];
  g+=`<ellipse cx="${L-24}" cy="${ey+18}" rx="15" ry="8.5" fill="#ffa99f" opacity=".55" filter="url(#f${k})"/><ellipse cx="${R+24}" cy="${ey+18}" rx="15" ry="8.5" fill="#ffa99f" opacity=".55" filter="url(#f${k})"/>`;
  g+=eye(L)+eye(R)+mouth;
  if(o.glasses) g+=`<g fill="none" stroke="${INK}" stroke-width="3.2" opacity=".85"><circle cx="${L}" cy="${ey}" r="21"/><circle cx="${R}" cy="${ey}" r="21"/><path d="M141 ${ey-2} Q150 ${ey-7} 159 ${ey-2}"/></g>`;
  if(o.sweat) g+=`<path d="M232 ${top+42} Q248 ${top+64} 240 ${top+78} Q226 ${top+84} 222 ${top+70} Q222 ${top+58} 232 ${top+42} Z" fill="#9fd4ff" opacity=".9"/><ellipse cx="228" cy="${top+66}" rx="3" ry="5" fill="#fff" opacity=".8"/>`;
  if(o.laptop) g+=`<g transform="translate(0 28)"><ellipse cx="150" cy="282" rx="86" ry="8" fill="#3b3226" opacity=".12" filter="url(#f${k})"/>
    <path d="M74 284 L88 206 Q90 196 102 196 L198 196 Q210 196 212 206 L226 284 Z" fill="url(#lp${k})"/><circle cx="150" cy="240" r="11" fill="${G}"/>
    ${arm(84,204,70)}${arm(216,204,-70)}</g>`;
  if(o.mug) g+=`<g transform="translate(206 176)"><path d="M0 0 L44 0 L40 50 Q39 58 31 58 L13 58 Q5 58 4 50 Z" fill="#fff"/><path d="M0 0 L44 0 L42.5 18 L1.5 18 Z" fill="${G}" opacity=".9"/><path d="M43 14 Q62 14 60 30 Q58 42 41 42" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M14 -10 q-6 -10 2 -20 M30 -10 q-6 -10 2 -20" fill="none" stroke="#c8c3ba" stroke-width="4" stroke-linecap="round"/></g>${arm(210,214,-60)}`;
  const flip=o.flip?`transform="translate(300 0) scale(-1 1)"`:"";
  return `<svg class="ch" viewBox="0 -20 300 320" style="left:${o.x}px;top:${o.y}px;width:${o.w||300}px;overflow:visible">${defs}<g ${flip}>${g}</g></svg>`;
}
const check=`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const icon={
  lock:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2.4" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>`,
  key:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2.4" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"/></svg>`,
  shield:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.6 12.2l2.4 2.4 4.4-4.6" stroke-linecap="round"/></svg>`,
  bookmark:`<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2.4" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg>`,
  moon:`<svg width="70" height="70" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="${"#ffe7a0"}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
};
const N=9;
function frame(i,inner,{step,h,foot="",stageStyle=""}={}){
  return `<section class="p" id="p${i}">
    <div class="top"><span class="tag"><i>v</i>velog-mcp</span><span class="num">${String(i).padStart(2,"0")} / ${String(N).padStart(2,"0")}</span></div>
    <div class="cap">${step?`<span class="step">${step}</span>`:""}<div class="h">${h}</div></div>
    <div class="stage" style="${stageStyle}">${inner}</div>
    <div class="foot"><span>${foot}</span><span class="dots">${Array.from({length:N},(_,k)=>`<b class="${k+1===i?"on":""}"></b>`).join("")}</span></div>
  </section>`;
}
const pages=[];

// 1 cover
pages.push(frame(1,`
  ${blob({x:250,y:250,w:440,melt:true,eye:"line",mouth:"wave",sweat:true})}
  <div class="dr" style="left:56px;top:70px;transform:rotate(-6deg)">임시저장 <span>3주 전</span></div>
  <div class="dr" style="left:520px;top:120px;transform:rotate(5deg)">임시저장 <span>2주 전</span></div>
  <div class="dr" style="left:120px;top:250px;transform:rotate(3deg)">임시저장 <span>어제</span></div>
  <div class="dr" style="left:560px;top:300px;transform:rotate(-4deg)">임시저장 <span>방금</span></div>
`,{h:`개발자 블로그가<br>늘 <u>'임시저장'</u>에<br>머무는 이유`,foot:`<span class="swipe">옆으로 넘겨보세요 →</span>`,stageStyle:"top:500px;height:700px"}).replace('class="p"','class="p cover"').replace('<div class="foot">','<div class="foot" style="bottom:44px">'));

// 2 새벽 2시
pages.push(frame(2,`
  <div style="position:absolute;right:70px;top:60px">${icon.moon}</div>
  <div class="sfx" style="left:70px;top:80px;font-family:M,monospace;color:var(--gray);font-size:30px">AM 02:13</div>
  <div class="bub tl" style="left:120px;top:150px">잡았다…!<br>이건 무조건 <span style="color:var(--g)">블로그각</span>이다</div>
  ${blob({x:270,y:330,w:400,eye:"spark",mouth:"open",laptop:true})}
  <div class="sfx" style="left:190px;top:420px;transform:rotate(-14deg)">✦</div>
  <div class="sfx" style="left:760px;top:390px;transform:rotate(12deg)">✦</div>
`,{step:"STEP 1",h:`새벽 2시,<br>드디어 버그를 잡았다`,foot:"모든 블로그는 여기서 시작된다"}));

// 3 빈 에디터
pages.push(frame(3,`
  <div class="ed"><div class="t">제목을 입력하세요<span class="cur"></span></div><div class="ln" style="width:92%"></div><div class="ln" style="width:76%"></div><div class="ln" style="width:58%"></div></div>
  <div class="bub tr2" style="left:24px;top:290px">…뭐부터 쓰지</div>
  ${blob({x:60,y:450,w:330,eye:"small",mouth:"flat",sweat:true})}
  <div class="sfx" style="left:480px;top:470px;color:var(--gray);font-size:30px">(커서만 깜빡깜빡)</div>
`,{step:"STEP 2",h:`다음 날,<br>빈 에디터 앞에서 멈춤`,foot:"쓸 건 많은데 시작이 안 된다"}));

// 4 쌓이는 임시저장
pages.push(frame(4,`
